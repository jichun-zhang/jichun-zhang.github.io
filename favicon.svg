<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Jichun Zhang">
  <style>
    /* #-comment: inverted mark - ink field, paper J. Single letter, no serifs, so it holds at 16px. */
    .field { fill: #1A1D21 }
    .letter { fill: #FCFDFF }
    @media (prefers-color-scheme: dark) { .field { fill: #FCFDFF } .letter { fill: #1A1D21 } }
  </style>
  <rect class="field" width="64" height="64" rx="14"/>
  <text class="letter" x="32" y="47" font-family="Inter, sans-serif" font-size="46" font-weight="800"
        text-anchor="middle">J</text>
</svg>
