<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Jichun Zhang">
  <style>
    /* #-comment: the site's own palette - paper field, ink letter, a firm ink edge so the
       tile survives white browser chrome, and a toned field under dark chrome to cut glare. */
    .field { fill: #FCFDFF }
    .edge  { fill: none; stroke: rgba(26,29,33,.55); stroke-width: 2 }
    .letter { fill: #1A1D21 }
    @media (prefers-color-scheme: dark) { .field { fill: #F1F0EE } }
  </style>
  <rect class="field" width="64" height="64" rx="14"/>
  <rect class="edge" x="1" y="1" width="62" height="62" rx="13"/>
  <text class="letter" x="32" y="46" font-family="Inter, sans-serif" font-size="44" font-weight="800"
        text-anchor="middle">J</text>
</svg>
