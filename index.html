<style>
  :root{--bg:#FAF8F5;--text:#1A1A1A;--soft:#6B6B6B;--accent:#2A5C4A;--rule:#D8D4CD;
        --serif:"Source Serif 4",Georgia,serif;--mono:"DM Mono",ui-monospace,Menlo,monospace}

  .k{font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--soft)}
  hr{border:0;border-top:1px solid var(--rule);margin:20px 0}
</style>
</head>
